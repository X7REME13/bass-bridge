[package]
name = "bass-bridge"
version = "0.2.0"
edition = "2021"
authors = ["X7REME13"]
description = "System-wide Windows audio loopback capture and low-pass filter routing for subwoofers and chair tactile transducers"
readme = "README.md"
license = "MIT OR Apache-2.0"

[dependencies]
cpal = "0.15.3"
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
