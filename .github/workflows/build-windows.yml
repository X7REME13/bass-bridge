name: Build Windows Binary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build and Test
        shell: pwsh
        run: |
          Write-Host ">>> Running cargo check..."
          cargo check --verbose
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Write-Host ">>> Running cargo test..."
          cargo test --verbose
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Write-Host ">>> Running cargo build --release..."
          cargo build --release --verbose
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bass-bridge-windows-x64
          path: target/release/bass-bridge.exe

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v0.3.0
          name: "BassBridge v0.3.0"
          body: |
            ## BassBridge v0.3.0 (Windows x64)

            ### Audio Engine & DSP Fixes
            - Replaced choppy batch FIFO draining with an adaptive Catmull-Rom cubic resampler and feedback-free buffer priming to eliminate stuttering and high-frequency aliasing/clicks.
            - Replaced the discontinuous `soft_saturate` waveshaper with an envelope-following peak limiter and C1-continuous soft ceiling so heavy bass does not generate high-frequency harmonics.
            - Added an explicit feedback-loop guard preventing WASAPI loopback capture and playback on the same audio endpoint.
            - Switched UI-to-audio DSP parameter updates to lock-free atomics and added smooth gain ramping plus non-reallocating delay line updates.

            ### Interface & Live Monitor
            - Implemented a real-time 4096-point Hann FFT audio spectrum monitor (`20 Hz - 1000 Hz`) with live input/bass overlays and draggable LR4 crossover cutoff handle.
            - Upgraded the waveform scope to a zero-crossing triggered oscilloscope with synchronized input and filtered bass traces.
            - Simplified the interface, removed cluttered labels and icons, and added the live version badge (`v0.3.0`), sample-rate status indicator, and device-routing warnings.
          files: target/release/bass-bridge.exe
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
