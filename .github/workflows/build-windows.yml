name: Build Windows Binary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build and Test
        shell: pwsh
        run: |
          $summary = "## 🛠️ Build Diagnostics`n`n"
          
          Write-Host ">>> Running cargo check..."
          $checkOut = cargo check --verbose 2>&1
          $checkCode = $LASTEXITCODE
          $checkOut | ForEach-Object { Write-Host $_ }
          if ($checkCode -ne 0) {
            $summary += "### ❌ cargo check failed`n````text`n" + ($checkOut -join "`n") + "`n`````n"
            $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            exit 1
          }

          Write-Host ">>> Running cargo test..."
          $testOut = cargo test --verbose 2>&1
          $testCode = $LASTEXITCODE
          $testOut | ForEach-Object { Write-Host $_ }
          if ($testCode -ne 0) {
            $summary += "### ❌ cargo test failed`n````text`n" + ($testOut -join "`n") + "`n`````n"
            $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            exit 1
          }

          Write-Host ">>> Running cargo build --release..."
          $buildOut = cargo build --release --verbose 2>&1
          $buildCode = $LASTEXITCODE
          $buildOut | ForEach-Object { Write-Host $_ }
          if ($buildCode -ne 0) {
            $summary += "### ❌ cargo build --release failed`n````text`n" + ($buildOut -join "`n") + "`n`````n"
            $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            exit 1
          }

          $summary += "### ✅ All checks, tests, and release builds succeeded!`n"
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bass-bridge-windows-x64
          path: target/release/bass-bridge.exe

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v0.1.0
          name: "BassBridge v0.1.0 (Early Access Preview)"
          body: |
            ## 🔊 BassBridge v0.1.0 Windows Executable
            
            Ready to test on Windows 10/11!
            
            ### What's included:
            - **WASAPI Loopback Capture:** Routes system-wide audio in real-time.
            - **Linkwitz-Riley 4th-Order (LR4) Low-Pass Filter:** Steep 24 dB/octave attenuation.
            - **Stereo vs. Dual-Mono Routing:** Switch between dual chair tactile transducers and single subwoofers.
            - **Sample-Accurate Delay Compensation:** 0 to 500 ms delay line.
            - **Phase Inversion:** 0° or 180° polarity flip.
            - **Real-Time 60 FPS Oscilloscope:** Dual-trace visualizer for input vs bass.
            
            Download `bass-bridge.exe` below, launch it, select your audio devices, and click **Start Bass Routing**.
          files: target/release/bass-bridge.exe
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
