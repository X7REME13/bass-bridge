name: Build Windows Binary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build and Test
        shell: pwsh
        run: |
          Write-Host ">>> Running cargo check..."
          cargo check --verbose 2>&1 | Tee-Object -FilePath "check.log"
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Write-Host ">>> Running cargo test..."
          cargo test --verbose 2>&1 | Tee-Object -FilePath "test.log"
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Write-Host ">>> Running cargo build --release..."
          cargo build --release --verbose 2>&1 | Tee-Object -FilePath "build.log"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Push Build Log to ci-log branch
        if: always()
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B ci-log
          git add -f *.log
          git commit -m "CI build logs"
          git push origin ci-log -f

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bass-bridge-windows-x64
          path: target/release/bass-bridge.exe

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v0.2.0
          name: "BassBridge Pro v0.2.0 (Studio Overhaul & Boost)"
          body: |
            ## 🔊 BassBridge Pro v0.2.0 Windows Release

            Major update addressing audio power and interface aesthetics!

            ### ✨ What's New in v0.2.0:
            - **Massive Volume & Punch Boost:**
              - Default gain increased to **+6.0 dB** (with range up to **+36 dB**).
              - **Direct Summing Switch (+6 dB Voltage Boost):** Delivers double voltage directly into tactile transducers and subwoofers instead of standard 0.5x downmixing attenuation.
              - **Analog Tape Soft-Saturator / Limiter:** Smooth $\tanh(x)$ soft saturation prevents harsh DAC digital clipping when driving subwoofers and transducers hard.
            - **Cyber-Studio Dark UI Redesign:**
              - Custom dark metallic obsidian theme (`#0B0E12`) with neon studio cyan, mint, and amber accents.
              - **Interactive Frequency Response Bode Plot (20 Hz - 1000 Hz):** Live logarithmic frequency response curve visualizing the Linkwitz-Riley 4th-order (-24 dB/oct) slope with live crossover cutoff markers and energy glow.
              - **Dual Real-time Oscilloscope:** Dual-trace waveform monitor with CRT dark grid.
              - **Dual Hardware-Style LED Peak Meters:** Live dBFS level monitoring with clip warning.
              - **Quick Crossover Presets:** Instant 40 Hz Sub, 80 Hz THX, 120 Hz Shakers, and 160 Hz Punch buttons.
              - **Acoustic Distance Readout:** Shows physical wave travel distance equivalent in meters and feet for delay compensation.

            Download `bass-bridge.exe` below, launch it, choose your devices, and start bass routing!
          files: target/release/bass-bridge.exe
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
