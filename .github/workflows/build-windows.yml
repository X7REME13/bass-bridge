name: Build Windows Binary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build and Test
        shell: pwsh
        run: |
          Write-Host ">>> Running cargo check..."
          cargo check --verbose
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Write-Host ">>> Running cargo test..."
          cargo test --verbose
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Write-Host ">>> Running cargo build --release..."
          cargo build --release --verbose
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bass-bridge-windows-x64
          path: target/release/bass-bridge.exe

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v0.3.1
          name: "BassBridge v0.3.1"
          body: |
            ## BassBridge v0.3.1 (Windows x64)

            ### Low-Latency Audio Pipeline Fixes
            - Added low-latency WASAPI stream buffer negotiation (4 ms target with automatic fallback to device default).
            - Replaced the 20–44 ms pre-consume FIFO target with a 3 ms post-fill trough-tracking `JitterController` that trims stale startup backlog immediately upon priming.
            - Tightened rate-drift tracking and overrun capping to keep capture-to-subwoofer buffering latency minimal without underruns.
            - Added a live end-to-end buffer latency readout (`ms`) to the header status bar.
          files: target/release/bass-bridge.exe
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
